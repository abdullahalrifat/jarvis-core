name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e . -r requirements-dev.txt build twine
      - run: black --check src tests
      - run: ruff check src tests --select E9,F63,F7,F82
      - run: mypy src
      - run: pytest -q --cov=jarvis_core --cov-report=term-missing --cov-fail-under=85
      - run: python -m build
      - run: python -m twine check dist/*
