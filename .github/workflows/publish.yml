name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: jarvis-core-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate-build-publish:
    name: Validate, build and publish exact release tag
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jarvis-agent-core/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation and build dependencies
        run: python -m pip install -e . -r requirements-dev.txt build twine

      - name: Run full release validation
        run: |
          black --check src tests
          ruff check src tests --select E9,F63,F7,F82
          mypy src
          pytest -q --cov=jarvis_core --cov-report=term-missing --cov-fail-under=85

      - name: Validate release version and tag
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          expected="${GITHUB_REF_NAME#v}"
          test "$version" = "$expected"

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Verify wheel in a clean environment
        shell: bash
        run: |
          python -m venv /tmp/jarvis-core-release
          /tmp/jarvis-core-release/bin/python -m pip install dist/*.whl
          /tmp/jarvis-core-release/bin/python -c "import importlib.metadata as m; assert m.version('jarvis-agent-core') == '${GITHUB_REF_NAME#v}'"
          /tmp/jarvis-core-release/bin/python -c "from jarvis_core import ExecutionProof, VerificationRecord; assert ExecutionProof and VerificationRecord"

      - name: Create checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - name: Attest distributions
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
