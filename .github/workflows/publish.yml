name: Publish release

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: jarvis-core-publish-release-pr
  cancel-in-progress: false

jobs:
  validate-build-publish:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release-please--branches--main')
    name: Validate, tag and publish merged release PR
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jarvis-agent-core/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation and build dependencies
        run: python -m pip install -e . -r requirements-dev.txt build twine

      - name: Run full release validation
        run: |
          black --check src tests
          ruff check src tests --select E9,F63,F7,F82
          mypy src
          pytest -q --cov=jarvis_core --cov-report=term-missing --cov-fail-under=85

      - name: Read release version
        id: version
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([abrc][0-9]+)?$ ]]; then
            echo "Unsupported release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Verify wheel in a clean environment
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          python -m venv /tmp/jarvis-core-release
          /tmp/jarvis-core-release/bin/python -m pip install dist/*.whl
          /tmp/jarvis-core-release/bin/python -c "import importlib.metadata as m; assert m.version('jarvis-agent-core') == '$RELEASE_VERSION'"
          /tmp/jarvis-core-release/bin/python -c "from jarvis_core import ExecutionProof, VerificationRecord; assert ExecutionProof and VerificationRecord"

      - name: Create checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - name: Attest distributions
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "dist/*"

      - name: Create immutable GitHub release and tag if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; continuing with PyPI publication."
          else
            gh release create "$TAG" dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --target "$MERGE_SHA" \
              --title "Jarvis Core $VERSION" \
              --generate-notes
          fi

      - name: Remove checksum from PyPI payload
        run: rm dist/SHA256SUMS

      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
