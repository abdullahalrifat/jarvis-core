name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: Publish to PyPI after creating the GitHub release
        required: false
        default: false
        type: boolean

concurrency:
  group: jarvis-core-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_needed: ${{ steps.release.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install --upgrade build twine
      - name: Read and validate package version
        id: version
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([abrc][0-9]+)?$ ]]; then
            echo "Unsupported Python release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Check whether release is new
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; no artifacts will be rebuilt."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $RELEASE_TAG is new."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build distributions
        if: steps.release.outputs.needed == 'true'
        run: python -m build
      - name: Validate distributions
        if: steps.release.outputs.needed == 'true'
        run: python -m twine check dist/*
      - name: Create checksums
        if: steps.release.outputs.needed == 'true'
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.needed == 'true'
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Publish GitHub release
    needs: build
    if: needs.build.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Attest distributions
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "dist/*"
      - name: Create release if version is new
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Jarvis Core $RELEASE_VERSION" \
            --generate-notes

  publish-pypi:
    name: Optionally publish to PyPI
    needs: [build, github-release]
    if: ${{ vars.PUBLISH_PYPI == 'true' || inputs.publish_pypi == true }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jarvis-agent-core/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Remove non-package checksum file
        run: rm dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
