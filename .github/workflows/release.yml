name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: jarvis-core-release
  cancel-in-progress: false

jobs:
  release-please:
    name: Create or update release PR
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Explain release lifecycle
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          echo "Release ${{ steps.release.outputs.tag_name }} was created by Release Please."
          echo "The release publication workflow validates this exact tag before PyPI publication."
